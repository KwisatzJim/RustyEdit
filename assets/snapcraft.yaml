name: rustyedit
base: core24
version: "2.0.0"
summary: A modern terminal text editor
description: |
  RustyEdit is an independent fork of Microsoft Edit, inspired by the classic
  MS-DOS Editor and built with a modern terminal interface.
  https://github.com/KwisatzJim/RustyEdit

grade: stable
confinement: strict

apps:
  rustyedit:
    command: bin/edit
    plugs:
      - home

parts:
  edit:
    source: https://github.com/KwisatzJim/RustyEdit.git
    source-type: git
    plugin: rust
    build-packages:
      - build-essential
